<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Endless Canon · visuals harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101827;
        color: #f4efe6;
        font-family: system-ui, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        max-width: min(560px, calc(100vw - 20px));
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(10, 14, 26, 0.62);
        backdrop-filter: blur(8px);
        font-size: 12px;
        line-height: 1.4;
      }
      #panel .row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 4px 0;
        align-items: center;
      }
      #panel .label {
        width: 52px;
        opacity: 0.6;
      }
      #panel button {
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 3px 10px;
        cursor: pointer;
      }
      #panel button.on {
        background: rgba(255, 226, 170, 0.85);
        color: #1b2233;
        border-color: transparent;
      }
      #stats {
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
      }
      #mock {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        display: none;
      }
      #mock.show {
        display: block;
      }
      #mock .title {
        position: absolute;
        left: 50%;
        top: 44%;
        transform: translate(-50%, -50%);
        text-align: center;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
      }
      #mock h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 84px);
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      #mock .play {
        margin-top: 22px;
        display: inline-block;
        padding: 12px 34px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.12);
        font-size: 18px;
      }
      #mock .bar {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        height: 64px;
        border-radius: 16px;
        background: rgba(12, 16, 28, 0.55);
        backdrop-filter: blur(10px);
      }
      #debug {
        position: fixed;
        inset: 0;
        overflow: auto;
        background: #2a2f3a;
        padding: 12px;
        z-index: 20;
      }
      #debug canvas {
        display: block;
        margin: 0 0 12px;
        max-width: 100%;
        background: repeating-conic-gradient(#3a4050 0% 25%, #2b3040 0% 50%) 50% / 24px 24px;
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <div id="mock">
      <div class="title">
        <h1>Endless Canon</h1>
        <div class="play">▶ Play</div>
      </div>
      <div class="bar"></div>
    </div>
    <div id="panel"></div>
    <script type="module" src="/dev/visuals.ts"></script>
  </body>
</html>
